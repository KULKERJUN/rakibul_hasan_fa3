{% extends 'master/base.html' %}

{% block title %}
    {{title}}
{% endblock title %}
    

{% block block1 %}
<div class="card" style="width: 18rem;">
    <img src="{{ data.picture.url }}" width="100px" alt="Profile picture">
  <div class="card-body">
    <h5 class="card-title">Welcome to Profile {{data.full_name}}</h5>
  </div>
  <ul class="list-group list-group-flush">
    <li class="list-group-item">{{data.phone}}</li>
    <li class="list-group-item">{{data.address}}</li>
  </ul>
  <div class="card-body">
    <a href="{% url 'update_profile_view' %}" class="card-link">Update Profile</a>
  </div>
</div>
{% endblock block1 %}
